x-app-environment: &app-environment
  PYTHONPATH: /app
  DOCUMENT_DB_PATH: /app/data/documents.db
  UPLOAD_DIR: /app/uploads
  CHROMA_DIR: /app/chroma_db
  LOG_DIR: /app/logs
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CELERY_TASK_ALWAYS_EAGER: "false"
  CHROMA_WRITE_LOCK_TIMEOUT_SECONDS: ${CHROMA_WRITE_LOCK_TIMEOUT_SECONDS:-900}
  EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-small-zh-v1.5}
  EMBEDDING_DEVICE: ${DOCKER_EMBEDDING_DEVICE:-cpu}
  EMBEDDING_LOCAL_FILES_ONLY: ${DOCKER_EMBEDDING_LOCAL_FILES_ONLY:-false}
  HF_HOME: /app/model_cache/huggingface
  SENTENCE_TRANSFORMERS_HOME: /app/model_cache/sentence-transformers

x-app-volumes: &app-volumes
  - ${UPLOADS_HOST_PATH:-./uploads}:/app/uploads
  - ${LOGS_HOST_PATH:-./logs}:/app/logs
  - ${CHROMA_HOST_PATH:-./chroma_db}:/app/chroma_db
  - ${DATA_HOST_PATH:-./data}:/app/data
  - embedding_model_cache:/app/model_cache

services:
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      <<: *app-environment
    volumes: *app-volumes
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 300s
    init: true
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m celery -A app.celery_app:celery_app worker --loglevel=INFO --pool=solo --concurrency=1 --hostname=ingestion@%h
    hostname: ingestion-worker
    env_file:
      - .env
    environment:
      <<: *app-environment
    volumes: *app-volumes
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app:celery_app inspect ping -d ingestion@ingestion-worker --timeout=5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    stop_grace_period: 60s
    init: true
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m streamlit run web/streamlit_app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      <<: *app-environment
      API_BASE_URL: http://api:8000
      STREAMLIT_SERVER_HEADLESS: "true"
    volumes: *app-volumes
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    init: true
    restart: unless-stopped

volumes:
  redis_data:
  embedding_model_cache:
